[project]
name = "phoneai"
version = "0.1.0"
description = "AI phone assistant: outbound voice calls with tools, built on LiveKit Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "langchain-openrouter>=0.2.9",
    "livekit-agents[ai-coustics,openai]~=1.8",
    "livekit-api>=1.2.1",
    "livekit-plugins-ai-coustics>=0.3.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "recurring-ical-events>=3.8.2",
    "truststore>=0.10.4",
]

[project.scripts]
phoneai = "phoneai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phoneai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: calls a real LLM via OpenRouter (costs money; opt-in with -m llm)",
    "eval: judged multi-sample evals (costs money; run via phoneai eval)",
]
addopts = "-m 'not llm and not eval'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
