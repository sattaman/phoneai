# Voice profiles: one per pipeline configuration we want to compare.
# Model ids are LiveKit Inference (STT/TTS) and OpenRouter (LLM).
uk_default:                 # LLM chosen by the evals in docs/evals.md; voice by ear
  stt_model: assemblyai/universal-3-6-pro   # beat Deepgram on UK phone audio (docs/voice-experiments.md)
  stt_language: en-GB
  llm_model: openai/gpt-4.1-mini
  llm_fallback: google/gemini-2.5-flash-lite
  tts_model: cartesia/sonic-3.6
  tts_voice: 79a125e8-cd45-4c13-8a67-188112f4dd22  # British female; ~0.35s to first audio
  tts_language: en
  expressive: false           # true adds emotion/pauses but batches text, ~0.5-1s slower
  min_endpointing_delay: 0.5
  record_audio: false

uk_deepgram:                # previous default: British voice, slower to start (~0.9s)
  stt_model: deepgram/nova-3
  stt_language: en-GB
  llm_model: openai/gpt-4.1-mini
  llm_fallback: google/gemini-2.5-flash-lite
  tts_model: deepgram/aura-2
  tts_voice: pandora
  tts_language: en-GB
  record_audio: false

uk_default_recorded:        # same, with audio recording: owner-only calls
  stt_model: assemblyai/universal-3-6-pro   # beat Deepgram on UK phone audio (docs/voice-experiments.md)
  stt_language: en-GB
  llm_model: openai/gpt-4.1-mini
  llm_fallback: google/gemini-2.5-flash-lite
  tts_model: cartesia/sonic-3.6
  tts_voice: 79a125e8-cd45-4c13-8a67-188112f4dd22
  tts_language: en
  expressive: false
  min_endpointing_delay: 0.5
  record_audio: true

uk_cheap:                   # ~5x cheaper LLM; misses some save_note calls (docs/evals.md)
  stt_model: deepgram/nova-3
  stt_language: en-GB
  llm_model: google/gemini-2.5-flash-lite
  llm_fallback: openai/gpt-4.1-nano
  tts_model: deepgram/aura-2
  tts_voice: pandora
  tts_language: en-GB
  record_audio: false

uk_luna:                    # GPT-6 Luna, reasoning minimal: ~3x cheaper, ~0.5s slower first token
  stt_model: deepgram/nova-3
  stt_language: en-GB
  llm_model: openai/gpt-6-luna
  llm_fallback: openai/gpt-4.1-mini
  llm_reasoning_effort: minimal
  tts_model: deepgram/aura-2
  tts_voice: pandora
  tts_language: en-GB
  record_audio: false

uk_gemini_live:             # speech-to-speech (P4); needs GEMINI_API_KEY
  realtime_model: gemini-3.8-live-extended-thinking
  realtime_voice: Zephyr
  realtime_thinking: LOW      # lowest this model accepts (MINIMAL is rejected)
  realtime_end_sensitivity: HIGH   # end the caller's turn sooner
  realtime_silence_ms: 500
  voice_style: >-
    Speak with a natural, warm British (southern English) accent, like a friendly
    assistant on the phone: relaxed, upbeat, quick, with a touch of dry humour.
    Reply immediately; keep each reply to one or two short sentences.
  record_audio: false

uk_gemini_flash_live:       # faster, non-thinking Gemini Live (listener favourite)
  realtime_model: gemini-3.1-flash-live-preview
  realtime_voice: Zephyr
  realtime_end_sensitivity: HIGH
  realtime_silence_ms: 500
  voice_style: >-
    Speak with a natural, warm British (southern English) accent, like a friendly
    assistant on the phone: relaxed, upbeat, quick, with a touch of dry humour.
    Reply immediately; keep each reply to one or two short sentences.
  record_audio: false
